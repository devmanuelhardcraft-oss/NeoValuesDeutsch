<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#18181b">
    <title>NeovaluesDeutsch</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="manifest" href="manifest.webmanifest">
    <script src="theme.js"></script>
</head>
<body>
    <button class="theme-toggle-corner" onclick="toggleTheme()" aria-label="Hell-/Dunkelmodus umschalten">
        <svg width="80" height="80" viewBox="0 0 250 250" aria-hidden="true">
            <path d="M0,0 L250,250 L250,0 Z"></path>
            <g class="icon-sun" transform="translate(142, 52) scale(2.2)">
                <circle cx="12" cy="12" r="4"></circle>
                <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
            </g>
            <g class="icon-moon" transform="translate(142, 52) scale(2.2)">
                <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
            </g>
        </svg>
    </button>

    <div class="main-container">
        <h1>NeovaluesDeutsch</h1>
        <p class="intro-text">Ein klarer und verständlicher Werte-Test für alle. Einfach nutzbar auf Smartphone, Tablet und Computer.</p>

        <div id="buttons">
            <button onclick="location.href='Instruction.html'">Test starten</button>
            <button onclick="location.href='values.html'">Werte</button>
            <button onclick="location.href='ideologies.html'">Ideologien</button>
            <button onclick="location.href='about.html'">Über uns</button>
            <button onclick="location.href='contact.html'">Kontakt</button>
            <button onclick="location.href='privacy.html'">Datenschutz</button>
            <button onclick="location.href='impressum.html'">Impressum</button>
            <button onclick="location.href='support.html'">Hilfe</button>
        </div>

        <div class="footer-icons">
            <a href="support.html" title="Hilfe" class="footer-icon-link">
                <img src="icon.svg" alt="Hilfe" class="footer-icon">
            </a>
            <a href="https://github.com/neomediavalist/neovalues" target="_blank" rel="noopener noreferrer" title="Originalprojekt NeoValues" class="footer-icon-link">
                <img src="icon.svg" alt="Originalprojekt auf GitHub" class="footer-icon">
            </a>
        </div>
    </div>
</body>
</html>
